<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>G-Man Console</title><style>body { background-color: #050b05; color: #00ff00; font-family: monospace; margin: 0; padding: 20px; overflow: hidden; }.grid-container { display: grid; grid-template-rows: 400px 1fr; gap: 20px; height: 95vh; }#canvas-viewport { border: 2px solid #00ff00; background: radial-gradient(circle, #0c1f0c 0%, #020702 100%); display: flex; justify-content: center; align-items: center; }.wireframe-box { width: 100px; height: 100px; border: 2px dashed #00ff00; animation: spin 8s linear infinite; }#terminal-panel { border: 1px solid #00aa00; background-color: #010401; padding: 15px; display: flex; flex-direction: column; }.log-stream { flex-grow: 1; overflow-y: auto; color: #88ff88; }.input-line { display: flex; }#user-input { background: transparent; border: none; color: #00ff00; font-family: inherit; font-size: 16px; width: 100%; outline: none; }@keyframes spin { 0% { transform: rotateX(0deg) rotateY(0deg); } 100% { transform: rotateX(360deg) rotateY(360deg); } }</style></head><body><div class="grid-container"><div id="canvas-viewport"><div class="wireframe-box"></div></div><div id="terminal-panel"><div class="log-stream" id="logs">[SYSTEM INITIALIZED] Ready for voice tracking prompt transmission...</div><div class="input-line"><span>G-MAN_RECON&gt;&nbsp;</span><input type="text" id="user-input" autofocus></div></div></div><script>const inputField = document.getElementById("user-input"); const logsContainer = document.getElementById("logs"); inputField.addEventListener("keydown", async function(e) { if (e.key === "ENTER") { const prompt = inputField.value.trim(); if (!prompt) return; logsContainer.innerHTML += `<br><span style="color:#ffffff;">&gt; ${prompt}</span>`; inputField.value = ""; try { const res = await fetch("https://workers.dev", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: [{ role: "user", content: prompt }] }) }); const data = await res.json(); const gmanText = data.result ? data.result.response : data.choices.message.content; logsContainer.innerHTML += `<br><span style="color:#00ff00;">[G-MAN]: ${gmanText}</span>`; } catch (err) { logsContainer.innerHTML += `<br><span style="color:#ff0000;">[ERROR CONNECTING TO EDGE MATRIX]</span>`; } } });</script></body></html>
