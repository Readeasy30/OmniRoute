name: Production Docker Build & Edge Proxy Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Clean Production Compile & Push
    runs-on: ubuntu-latest
    steps:
      - name: Source Tree Synchronization
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Forced Peer Dependency Installation
        run: npm install --legacy-peer-deps --prefer-online --no-audit

      - name: Execute High-Performance Build
        run: npm run build
