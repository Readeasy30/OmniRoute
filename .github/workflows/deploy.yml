name: Production Docker Build & Edge Proxy Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-pack:
    name: Container Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Source Synchronization
        uses: actions/checkout@v4

      - name: Set Up Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean Module Ingestion
        run: npm install --legacy-peer-deps --prefer-online --no-audit

      - name: Build Local Source Binary
        run: npm run build
