name: Cloudflare Edge OmniRoute Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Installs Node.js environment to compile/push JavaScript assets
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Automatically deploys worker.js straight into your Cloudflare edge architecture
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker.js --name omniroute-gateway

        
