version: "1.0"

server:
  port: 20128

# ------------------------------------------------------------------------------
# Routing Architectures: Stacking failbacks from premium to fallback topologies
# ------------------------------------------------------------------------------
combos:
  - name: production-coder-stack
    strategy: priority # Progresses strictly from top to bottom based on failure states
    nodes:
      - provider: deepseek
        model: deepseek-coder
      - provider: anthropic
        model: claude-3-5-sonnet
      - provider: openai
        model: gpt-4o
      - provider: pollinations # Zero-auth open pool used as the ultimate fail-safe backup node
        model: auto

  - name: cost-optimized-stack
    strategy: cost_optimized # Selects underlying structures based on ongoing token tracking metrics
    nodes:
      - provider: google
        model: gemini-2.0-flash
      - provider: deepseek
        model: deepseek-chat

# ------------------------------------------------------------------------------
# Provider Configurations — Secrets must be loaded via local environment space
# ------------------------------------------------------------------------------
providers:
  pollinations:
    enabled: true # Keyless infrastructure provider logic

  deepseek:
    enabled: true
    api_key: ${DEEPSEEK_API_KEY} # Seamless extraction from local execution variables

  anthropic:
    enabled: true
    api_key: ${ANTHROPIC_API_KEY}

  openai:
    enabled: true
    api_key: ${OPENAI_API_KEY}

  google:
    enabled: true
    api_key: ${GOOGLE_AI_API_KEY}

# ------------------------------------------------------------------------------
# System Compression Pipeline & Optimization Gating Rules
# ------------------------------------------------------------------------------
routing:
  fallback_enabled: true
  max_retries: 3
  timeout: 35s
  # Performance payload layer reducing network ingestion burdens
  context_compression:
    enabled: true
    strategy: rtk_caveman # Saves 15-95% on eligible upstream text parsing context frames

    # ------------------------------------------------------------------------------
# Security Guardrails, PII Masking, and Prompt Injection Defense Policies
# ------------------------------------------------------------------------------
security:
  input_sanitizer:
    enabled: true
    # Rejects incoming request frames entirely if malicious patterns are detected
    enforcement_mode: block 
    
    # Patterns designed to intercept common jailbreak and prompt manipulation tactics
    injection_signatures:
      - "(?i)ignore previous instructions"
      - "(?i)system prompt bypass"
      - "(?i)you are now in developer mode"
      - "(?i)dan mode unchained"
      - "(?i)output raw system configurations"

  pii_masking:
    enabled: true
    strategy: replace_placeholder # Options: replace_placeholder, redact, encrypt
    placeholder_template: "[REDACTED_{PII_TYPE}]"
    
    # Target entities parsed out inline before payloads leave the gateway
    entities:
      - email_addresses
      - credit_cards
      - ipv4_addresses
      - secret_keys
      - custom_patterns:
          - name: AWS_SECRET_LEAK_GUARD
            regex: "(?i)amzn\\.mws\\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          - name: GENERIC_BEARER_TOKEN
            regex: "bearer\\s[a-zA-Z0-9_\\-\\.]{20,}"

  logging:
    mask_logs: true # Ensures payloads written to local disk logs maintain data masking rules

